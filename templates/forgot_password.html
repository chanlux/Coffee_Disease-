{% extends "base.html" %}

{% block title %}ភ្លេចពាក្យសម្ងាត់ - ប្រព័ន្ធអ្នកជំនាញជំងឺដើមកាហ្វេ{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="card border shadow-lg">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem; border-radius: 16px; background: linear-gradient(135deg, #d97706 0%, #b45309 100%);">
                        <i class="fas fa-key"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">ភ្លេចពាក្យសម្ងាត់</h3>
                    <p class="text-muted small">បញ្ចូលអ៊ីមែលរបស់អ្នកដើម្បីទទួលតំណកំណត់ឡើងវិញ</p>
                </div>

                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">អាសយដ្ឋានអ៊ីមែល</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="example@coffee.com" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
                        <i class="fas fa-paper-plane me-1"></i> ផ្ញើតំណកំណត់ពាក្យសម្ងាត់
                    </button>

                    <div class="text-center pt-2 border-top">
                        <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i> ត្រឡប់ទៅកាន់ទំព័រចូល
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
