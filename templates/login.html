{% extends "base.html" %}

{% block title %}ចូលប្រើប្រាស់ - ប្រព័ន្ធជំងឺដើមកាហ្វេ{% endblock %}

{% block content %}
<div class="login-container container d-flex justify-content-center align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body p-5">
                    
                    <div class="text-center mb-4">
                        <div class="coffee-logo">
                            <i class="fas fa-coffee fa-3x text-success"></i>
                        </div>
                        <h2 class="mt-3 fw-bold">ប្រព័ន្ធជំងឺដើមកាហ្វេ</h2>
                        <p class="text-muted">ចូលគណនីរបស់អ្នកដើម្បីចូលប្រើប្រាស់</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">អាសយដ្ឋានអ៊ីមែល</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="បញ្ចូលឈ្មោះអ្នកប្រើប្រាស់របស់អ្នក" required> 
                            </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">ពាក្យសម្ងាត់</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="បញ្ចូលពាក្យសម្ងាត់របស់អ្នក" required>
                            </div>
                        </div>
                                                
                        <div class="row mb-4">
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                    <label class="form-check-label" for="remember">ចងចាំខ្ញុំ</label>
                                </div>
                            </div>
                            <div class="col-6 text-end">
                                <a href="{{ url_for('auth.forgot_password') }}" class="text-success fw-semibold text-decoration-none">ភ្លេចពាក្យសម្ងាត់?</a>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">ចូល</button>

                        <div class="text-center mt-3">
                            <p class="text-muted mb-0">
                                មិនទាន់មានគណនីមែនទេ? 
                                <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold text-decoration-none">ចុះឈ្មោះ</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
