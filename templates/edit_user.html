{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h3><i class="fas fa-user-edit text-primary"></i> កែសម្រួលអ្នកប្រើប្រាស់៖ {{ user.username }}</h3>
            <hr>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">ឈ្មោះអ្នកប្រើប្រាស់</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">អ៊ីមែល</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">តួនាទី</label>
                    <select name="role" class="form-select">
                        <option value="user" {% if user.role == 'user' %}selected{% endif %}>អ្នកប្រើប្រាស់</option>
                        <option value="doctor" {% if user.role == 'doctor' %}selected{% endif %}>វេជ្ជបណ្ឌិត</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>អ្នកគ្រប់គ្រង</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">ធ្វើបច្ចុប្បន្នភាពអ្នកប្រើប្រាស់</button>
                    <a href="{{ url_for('auth.manage_users') }}" class="btn btn-secondary">បោះបង់</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
